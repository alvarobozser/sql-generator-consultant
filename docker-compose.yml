services:
  postgres:
    image: postgres:16-alpine
    container_name: sqlgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sqlgen
      POSTGRES_PASSWORD: sqlgen_dev_password
      POSTGRES_DB: sqlgen
    ports:
      - "5432:5432"
    volumes:
      - sqlgen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlgen -d sqlgen"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sqlgen_pgdata:
    name: sqlgen_pgdata
