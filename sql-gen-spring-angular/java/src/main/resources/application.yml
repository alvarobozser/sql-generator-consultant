spring:
  application:
    name: sqlgen-backend

  # PostgreSQL: usuario admin (read-write). Usado para inicializar el schema
  # y por el schema-port (que necesita acceso a information_schema).
  datasource:
    url: ${JAVA_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sqlgen}
    username: ${JAVA_DATASOURCE_USERNAME:sqlgen}
    password: ${JAVA_DATASOURCE_PASSWORD:sqlgen_dev_password}
    driver-class-name: org.postgresql.Driver

    # Segundo DataSource de solo-lectura (defense in depth).
    # Las queries del usuario se ejecutan con este.
    readonly:
      url: ${JAVA_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sqlgen}
      username: ${JAVA_DATASOURCE_READONLY_USERNAME:sqlgen_readonly}
      password: ${JAVA_DATASOURCE_READONLY_PASSWORD:readonly_password}
      driver-class-name: org.postgresql.Driver

# SDK nativo de Anthropic (leido directamente, sin pasar por Spring AI).
# Spring AI 1.x tiene un bug con Anthropic (envia Authorization: Bearer
# en vez de x-api-key), por eso usamos el SDK nativo.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:your_key_here}
llm:
  model: ${LLM_MODEL:claude-haiku-4-5}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.sqlgen: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
